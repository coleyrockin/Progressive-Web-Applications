<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><%= htmlWebpackPlugin.options.title %></title>
  <meta
    name="description"
    content="JATE is an installable offline-first text editor with syntax highlighting and local persistence."
  />
  <meta name="theme-color" content="#12141a" />
  <link rel="manifest" href="/manifest.json" />
</head>

<body>
  <nav id="navbar" aria-label="Application">
    <div class="brand-lockup" aria-label="JATE, Just Another Text Editor">
      <span class="brand-mark" aria-hidden="true">J</span>
      <div class="brand-copy">
        <span class="brand-name">J.A.T.E.</span>
        <span class="brand-subtitle">Just Another Text Editor</span>
      </div>
    </div>

    <button class="install-button hidden" id="buttonInstall" aria-label="Install JATE" type="button">
      Install
    </button>
  </nav>

  <main id="main" aria-label="Text editor">
    <div class="loading-container">
      <div class="loading-spinner" aria-label="Loading editor"></div>
    </div>
  </main>
  <noscript>
    <div class="editor-error">
      JavaScript is required to use this editor.
    </div>
  </noscript>

</body>

</html>
