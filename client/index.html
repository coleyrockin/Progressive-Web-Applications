<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>
  <meta name="description" content="Offline-first browser text editor with syntax highlighting and PWA support." />
  <meta name="theme-color" content="#225ca3" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/codemirror.min.css" crossorigin="anonymous">
  <script
    type="text/javascript"
    src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/codemirror.min.js"
    crossorigin="anonymous">
  </script>
  <script
    type="text/javascript"
    src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/mode/javascript/javascript.min.js"
    crossorigin="anonymous">
  </script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/theme/monokai.min.css"
    crossorigin="anonymous">
</head>

<body>
  <nav id="navbar">
    <div class="nav-btn">
      <button class="btn btn-sm btn-dark" id="buttonInstall" aria-label="Install this app" type="button">Install</button>
    </div>
    <h1>Just Another Text Editor</h1>

    <div class="navbar-brand"><img src="./assets/icons/icon_96x96.png" alt="" /></div>
  </nav>

  <main id="main">
    <div class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  </main>
  <noscript>
    <div class="editor-error">
      JavaScript is required to use this editor.
    </div>
  </noscript>

</body>

</html>
